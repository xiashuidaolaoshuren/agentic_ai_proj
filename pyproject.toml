[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-agent"
version = "0.1.0"
description = "Local-first AI news research digest agent (Milestone 1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Felix" }]
keywords = ["ai", "news", "langgraph", "digest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "bilibili-api-python>=17.0",
  "httpx>=0.27",
  "openai>=1.40",
  "langgraph>=1.0,<2.0",
  "gradio>=4.0",
  "python-dotenv>=1.0",
]

[project.scripts]
ai-news-agent = "ai_news_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: hits real external APIs (opt-in via RUN_LIVE_BILIBILI=1)",
]
